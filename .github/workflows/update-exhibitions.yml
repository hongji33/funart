name: 전시 정보 매주 자동 갱신

on:
  schedule:
    - cron: '0 23 * * 0'   # 매주 월요일 오전 8시(한국시간) = 일요일 23시(UTC)
  workflow_dispatch: {}      # '수동 실행' 버튼도 사용 가능

permissions:
  contents: write

jobs:
  update-exhibitions:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 전시 정보 받아오기
        env:
          CULTURE_API_KEY: ${{ secrets.CULTURE_API_KEY }}
        run: python update_exhibitions.py

      - name: 변경사항 저장(커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exhibitions.json
          if git diff --staged --quiet; then
            echo "바뀐 내용이 없어요."
          else
            git commit -m "전시 정보 자동 갱신 ($(date +%Y-%m-%d))"
            git push
          fi
